<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Picker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div class="container">
        <div class="head">
          <div class="eyeDrop"></div>
          <div class="title">Colors</div>
        </div>
        <div class="middle">
          <div class="colorBox"></div>
          <div class="opacity">
            <div class="opacitySlider"></div>
            <div class="opacityPercentage"></div>
          </div>
          <div class="bottom">
            <div class="colorselected"></div>
            <div class="colors"></div>
          </div>
        </div>
      </div>
    </div>
 
    <script src="script.js"></script>
  </body>
</html>
